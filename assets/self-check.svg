<?xml version="1.0" encoding="utf-8"?><svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg"><rect fill="#F4E8DB" width="1600" height="900"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="44" font-weight="bold" x="70" y="84">IT GOES BACK AND </text><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="44" font-weight="bold" x="521" y="84">CHECKS WHAT IT TOLD YOU.</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" font-weight="normal" x="70" y="132">point it at your repo and it re-reads your commits, then grades every note it kept</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="18" font-weight="bold" x="70" y="205">WHAT IT WROTE DOWN</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="18" font-weight="bold" x="830" y="205">WHAT YOUR REPO SAYS TODAY</text><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#CEB9A6" stroke-width="1.5" width="620" x="70" y="240"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" font-weight="normal" x="106" y="292">the auth check lives in login.rs:42</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="17" font-weight="normal" x="106" y="326">learned six weeks ago, from your commit</text><line stroke="#62594F" stroke-linecap="round" stroke-width="2.2" x1="710" x2="800" y1="300" y2="300"/><polygon fill="#62594F" points="800,300 789,307 789,293"/><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#A74726" stroke-width="2.3" width="690" x="830" y="240"/><rect fill="#A74726" height="120" rx="5" ry="5" width="10" x="830" y="240"/><text fill="#A74726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" x="872" y="294">STILL TRUE</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="18" font-weight="normal" x="872" y="328">the line is exactly where the note said it would be</text><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#CEB9A6" stroke-width="1.5" width="620" x="70" y="400"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" font-weight="normal" x="106" y="452">the retry cap is 3</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="17" font-weight="normal" x="106" y="486">learned from src/client.rs:88</text><line stroke="#62594F" stroke-linecap="round" stroke-width="2.2" x1="710" x2="800" y1="460" y2="460"/><polygon fill="#62594F" points="800,460 789,467 789,453"/><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#C87832" stroke-width="2.3" width="690" x="830" y="400"/><rect fill="#C87832" height="120" rx="5" ry="5" width="10" x="830" y="400"/><text fill="#C87832" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" x="872" y="454">IT MOVED</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="18" font-weight="normal" x="872" y="488">the code shifted under the note — flagged, not deleted</text><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#CEB9A6" stroke-width="1.5" width="620" x="70" y="560"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="22" font-weight="normal" x="106" y="612">config loads from env.toml</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="17" font-weight="normal" x="106" y="646">learned in March</text><line stroke="#62594F" stroke-linecap="round" stroke-width="2.2" x1="710" x2="800" y1="620" y2="620"/><polygon fill="#62594F" points="800,620 789,627 789,613"/><rect fill="#F8EFE5" height="120" rx="18" ry="18" stroke="#9B887A" stroke-width="2.3" width="690" x="830" y="560"/><rect fill="#9B887A" height="120" rx="5" ry="5" width="10" x="830" y="560"/><text fill="#9B887A" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="26" font-weight="bold" x="872" y="614">NOTHING BACKS IT</text><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="18" font-weight="normal" x="872" y="648">your repo no longer says this anywhere</text><line stroke="#CEB9A6" stroke-width="1.5" x1="0" x2="1600" y1="730" y2="730"/><text fill="#62594F" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="17" font-weight="normal" x="70" y="776">this scan:</text><rect fill="#F1E0D0" height="54" rx="14" ry="14" stroke="#E8D7C6" stroke-width="1" width="450" x="70" y="796"/><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="24" font-weight="bold" text-anchor="middle" x="295" y="830">1 still true · 1 moved · 1 gone</text><text fill="#252422" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="23" font-weight="normal" x="570" y="830">It grades its own memory. What it cannot check, it does not grade.</text></svg>