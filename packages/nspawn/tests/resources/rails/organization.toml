  "NODE_", "HOMEBREW_", "DOCKER_", "SYSTEMD_", "INVOCATION_ID", "JOURNAL_STREAM",
  "TMUX", "ZELLIJ", "TERM", "COLUMNS", "LINES", "NO_COLOR", "FORCE_COLOR", "CI",
  "RUNNER_", "ACTIONS_", "SLACK_", "TRACEPARENT", "MINIMAX_", "DEEPSEEK_", "QWEN_",
