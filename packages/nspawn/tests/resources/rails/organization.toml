# NOTT_NMEMORY_, NOTT_HARNESS_... ). A harness noun owns the variables of that concept.
owners = [
  "ACP", "ALERT", "APP", "BODY", "BRAKE", "CAMPAIGN", "DATABASE", "DOOR", "EVAL", "GITHUB",
  "HOST", "INTENT", "LEDGER", "MCP", "MEMORY", "NODE", "ORGANIZATION", "PLUGIN", "PR", "PRINCIPAL",
  "SCENARIO", "SITE_PREVIEW", "SPILL", "STATE", "TEST", "FIXTURE", "WEB", "WORKFLOW",
]
foreign_prefixes = [
  "ANTHROPIC_", "CLAUDE_", "CODEX_", "OPENAI_", "GEMINI_", "GOOGLE_", "ZAI_", "OPENROUTER_",
  "GITHUB_", "GH_", "GIT_", "PG", "XDG_", "UV_", "PYTEST_", "PYTHON", "VIRTUAL_ENV",
