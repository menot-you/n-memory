# The organization canon of this repository: one name, one home and one grammar per concept.
#
# This file is the ONE declared mapping (plugin/skills/quality/references/organization.md).
# `tools/organization.py check` measures the tree against it; `rails/organization-debt.txt`
# holds what does not conform yet, and only shrinks. A second table of names anywhere else
# is a defect.
#
# Derivation per member kind (the `name` is the member's noun):
#
#   lib      libs/<name>              distribution nott-<name>     package nott_<name>
#                                     executable   nott-<name>     variables NOTT_<NAME>_*
#   mcp      apps/<name>              distribution n<name>         package n<name>
#            apps/<group>/core        n<group>                     (group core)
#            apps/<group>/<part>      n<group>-<part>              package n<group>_<part>
#                                     executable   = distribution  variables NOTT_N<NAME>_*
#   app      apps/<name>              distribution nott-<name>     package nott_<name>
#                                     executable   nott-<name>     variables NOTT_<NAME>_*
#   harness  harness/                 distribution nott-harness    package nott_harness
#                                     no executable: the CLI (`apps/cli`) is its client
#                                     variables NOTT_<NOUN>_* for a noun it owns
#
# A member has AT MOST ONE executable; further pieces are verbs of it. The product
# executable `nott` is the one declared exception (see [exception.executable]).

schema = 1

[grammar]
# Commands read `<executable> <noun> <verb>`. Door operations `<noun>.<verb>`, ACP
# extensions `_nott/<noun>/<verb>`, MCP tools `<executable>_<noun>_<verb>`, scripts
# `<folder>/<noun>.<ext> <verb>`. Nouns are singular. Both sets are closed: a new word
# enters here first, in the same change that uses it.
