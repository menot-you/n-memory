# `<dir>/<member>.sqlite3`. Only tests, and parents that rewrite a child's HOME, set it.
# `retired_env` are the database variables that retire with PostgreSQL, the D5 spellings
# included; each also gets `""` in [map.env] in the campaign that removes its last spelling.
# Rail P (`tools/rail/postgres.sh`) refuses all of these in any persistent setter.
[database]
variable = "NOTT_DATABASE_DIR"
retired_env = [
  "NOTT_NMEMORY_DATABASE_URL", "NOTT_NSPAWN_DATABASE_URL", "NOTT_DATABASE_URL",
  "NOTT_DATABASE_TAG", "NOTT_DATABASE_ALLOW_REMOTE", "NOTT_LEDGER_URL",
  "NJOURNAL_DATABASE_URL", "NBROKER_DATABASE_URL", "NMEMORY_ALLOW_PROD",
  "NLEARNING_DATABASE_URL", "NLIMIT_TEST_DATABASE_URL",
  "NOTT_JOURNAL_DATABASE_URL", "NOTT_BROKER_DATABASE_URL", "NOTT_NMEMORY_ALLOW_PROD",
  "NOTT_NMEMORY_TEST_DATABASE_URL", "NOTT_GRAPH_DATABASE_URL", "NOTT_NMEMORY_EVALS_DATABASE_URL",
  "NOTT_NSHIP_DATABASE_URL", "NOTT_NVISION_DATABASE_URL", "NOTT_NDEV_DATABASE_URL",
  "NOTT_NDEV_TEST_DATABASE_URL", "NOTT_NDEV_DB", "NOTT_NMEMORY_LANE_DB_MAX_AGE",
  "NOTT_NMEMORY_DDL_LOCK_TIMEOUT_MS",
  "NGRAPH_DATABASE_URL", "NSHIP_DATABASE_URL", "NVISION_DATABASE_URL", "NDEV_DATABASE_URL",
  "NDEV_TEST_DATABASE_URL", "NDEV_DB", "NMEMORY_TEST_DATABASE_URL", "NMEMORY_EVAL_DATABASE_URL",
  "NMEMORY_DATABASE_URL", "NMEMORY_DDL_LOCK_TIMEOUT_MS", "NMEMORY_LANE_DB_MAX_AGE",
]

