# Identities of data already stored, kept under the name they were written with. Gate
# receipts and stage manifests on disk carry these schema ids and every reader matches the
# bytes: renaming one orphans each record that carries it. The next version takes the
# current name (`nott.python.<kind>.v2`) instead of renaming this one.
[exception.stored_identity]
"nott.pygreen.member.v1" = "the per-member receipt the python gate writes and compare.py reads back"
"nott.pygreen.spans.v1" = "the run's span profile, sealed in the cache and read by its readers"
"nott.pygreen.stage.v1" = "the per-stage report the cache validates before it reuses a stage"
"nott.pygreen.stages.v1" = "the stage manifest the cache and compare.py validate before reuse"

# Reads of a renamed variable that go around the reader's `env()`: each names where the
# refusal happens instead. Declared one by one, never by glob.
[exception.env_bypass]
"tools/fixture/benchmark_runtime.py" = "launched by tools/fixture/pool-start.sh on the fixture VM with an explicit environment"
"tools/fixture/pool_witness.py" = "launched by tools/fixture/pool-start.sh on the fixture VM with an explicit environment"
"tools/fixture/u5_witness.py" = "launched by tools/fixture/pool-start.sh on the fixture VM with an explicit environment"

# Every variable renamed by this campaign. `""` retires it (its only readers are gone or
# were fences for a contract that no longer exists).
# Names that only look like variables are not here: GATE_ROOT is a Python constant read
# from NOTT_BODY_GATE_ROOT, GATE_QUEUE a panel section, and GATE_PYTHON, GATE_PACKAGE,
